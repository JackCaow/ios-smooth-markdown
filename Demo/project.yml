name: SmoothMarkdownDemo
options:
  bundleIdPrefix: com.jackcaow
  deploymentTarget:
    iOS: '17.0'
packages:
  SmoothMarkdown:
    path: ..
targets:
  SmoothMarkdownDemo:
    type: application
    platform: iOS
    sources:
      - SmoothMarkdownDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackcaow.smoothmarkdown.demo
        SWIFT_VERSION: '5.9'
        CODE_SIGNING_ALLOWED: NO
    info:
      path: SmoothMarkdownDemo/Info.plist
      properties:
        UILaunchScreen: {}
    dependencies:
      - package: SmoothMarkdown
  SmoothMarkdownDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SmoothMarkdownDemoUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackcaow.smoothmarkdown.demo.uitests
        SWIFT_VERSION: '5.9'
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: SmoothMarkdownDemo
