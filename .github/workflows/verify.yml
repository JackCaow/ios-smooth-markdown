name: Verify iOS library and Demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    steps:
      - name: Check out iOS
        uses: actions/checkout@v7
        with:
          path: ios-smooth-markdown
      - name: Check out Flutter fixture source
        uses: actions/checkout@v7
        with:
          repository: JackCaow/flutter-smooth-markdown
          ref: 80e6bb608389c2f8849ff381cdd173eae5e891b7
          path: flutter-smooth-markdown
      - name: Check Flutter Demo fixtures
        working-directory: ios-smooth-markdown
        run: python3 tools/check_flutter_example_parity.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Demo project
        working-directory: ios-smooth-markdown/Demo
        run: xcodegen generate
      - name: Select iPhone simulator
        id: simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for group in devices.values() for device in group if device["name"]=="iPhone 17 Pro" and device["isAvailable"]))')
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Test Swift package
        working-directory: ios-smooth-markdown
        run: xcodebuild test -scheme ios-smooth-markdown -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Build Demo
        working-directory: ios-smooth-markdown
        run: xcodebuild build -project Demo/SmoothMarkdownDemo.xcodeproj -scheme SmoothMarkdownDemo -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' CODE_SIGNING_ALLOWED=NO
