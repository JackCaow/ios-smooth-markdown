name: Verify iOS library and Demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    steps:
      - name: Check out iOS
        uses: actions/checkout@v7
        with:
          path: ios-smooth-markdown
      - name: Check out Flutter fixture source
        uses: actions/checkout@v7
        with:
          repository: JackCaow/flutter-smooth-markdown
          ref: 0634734ccc6e2c63ab78904a68496f4b0a29f071
          path: flutter-smooth-markdown
      - name: Check Flutter Demo fixtures
        working-directory: ios-smooth-markdown
        run: python3 tools/check_flutter_example_parity.py
      - name: Download pinned CommonMark 0.31.2 examples
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://spec.commonmark.org/0.31.2/spec.json \
            --output "$RUNNER_TEMP/commonmark-spec.json"
          echo "d431b29d97b6f73e69d547109cf5081578fac931e72afe95639ebe766c1b2a20  $RUNNER_TEMP/commonmark-spec.json" \
            | shasum -a 256 --check
      - name: Run Swift tests and official source-range sweep
        working-directory: ios-smooth-markdown
        env:
          COMMONMARK_SPEC_JSON: ${{ runner.temp }}/commonmark-spec.json
        run: swift test --parallel
      - name: Verify independent public consumers and API declarations
        working-directory: ios-smooth-markdown
        run: |
          swift run --package-path Consumers/Smoke CoreConsumer
          swift run --package-path Consumers/Smoke ReaderConsumer
          python3 tools/check_public_api.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Demo project
        working-directory: ios-smooth-markdown/Demo
        run: xcodegen generate
      - name: Compile Swift package tests for iOS devices
        working-directory: ios-smooth-markdown
        run: xcodebuild build-for-testing -scheme ios-smooth-markdown -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
      - name: Build Demo for iOS devices
        working-directory: ios-smooth-markdown
        run: xcodebuild build -project Demo/SmoothMarkdownDemo.xcodeproj -scheme SmoothMarkdownDemo -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO

      - name: Validate CocoaPods Core and UI subspecs
        working-directory: ios-smooth-markdown
        run: pod lib lint SmoothMarkdown.podspec --allow-warnings --skip-tests
      - name: Run public configuration rendering tests
        working-directory: ios-smooth-markdown
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcodebuild test -project Demo/SmoothMarkdownDemo.xcodeproj -scheme SmoothMarkdownDemo -destination "platform=iOS Simulator,id=$DEVICE_ID" -only-testing:SmoothMarkdownDemoTests/DesignTokenRenderingTests -only-testing:SmoothMarkdownDemoTests/PublicLibraryConfigurationTests -only-testing:SmoothMarkdownDemoTests/MarkdownResourcesTests -only-testing:SmoothMarkdownDemoTests/PublicLibraryRuntimeTests -only-testing:SmoothMarkdownDemoTests/MarkdownEditorParserPluginTests CODE_SIGNING_ALLOWED=NO
